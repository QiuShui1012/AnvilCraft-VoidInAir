name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
      - dev/**
    paths:
      - .github/workflows/pull_request.yml
      - src/**
      - gradle/**
      - build.gradle
      - dependencies.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: pr
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version'

      - name: Make Colon-free Mod Name
        id: 'colon_free_mod_name'
        run: |
          MESSAGE=$(echo "${{ steps.properties.outputs.mod_name }}" | tr -d ':')
          echo "value=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Read TOML
        id: toml
        uses: Gu-ZT/toml-reader-action@main
        with:
          file: gradle/libs.versions.toml
          fields: |
            versions.minecraft
            versions.neoforge
            versions.anvillib
            versions.anvilcraft

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4.3.1

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/* | grep sources.jar -v | grep shadow.jar -v | grep slim.jar -v | awk -F 'anvilcraft-voidinair-neoforge-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.colon_free_mod_name.outputs.value }} ${{ steps.version.outputs.version }}"
          path: build/libs/anvilcraft-voidinair-neoforge-${{ steps.version.outputs.version }}.jar

      - name: gametest
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        with:
          mods: |
            build/libs/anvilcraft-voidinair-neoforge-${{ steps.version.outputs.version }}.jar
          minecraft_version: ${{ steps.toml.outputs.versions_minecraft }}
          mod_loader: 'neoforge'
          loader_version: ${{ steps.toml.outputs.versions_neoforge }}
          extra-mods: |
            anvil-lib:${{ steps.toml.outputs.versions_anvillib }}
            anvilcraft:${{ steps.toml.outputs.versions_minecraft }}-${{ steps.toml.outputs.versions_anvilcraft }}
          quiet-setup: 'True'
